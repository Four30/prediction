<!DOCTYPE html>
<html>
    <head>
        <title>Prediction.</title>
        <link rel="stylesheet" href="{{ url_for('static', filename= '/css_frontend_prototype.css') }}">
    </head>
    <body>
        <div class = "identity">
            <p> If you encounter any issues, send me a dm at u/Plane-Brilliant857 on reddit!</p>
        </div>
        <div class = ""></div>
        <div class ="box">
            <div class="form">
                <form action ='/submit', method = "POST" >
                    <label for = "exam"><h3>Pick your education level.</h3></label>
                    <select id="edu_level", name = "exam" required>
                        <option value="blank"></option>
                        <option value="education-AS"><p>AS Level</p></option>
                        <option  value="education-A2"><p> A Level</p></option>
                    </select><br/><br/>
                    <label for = "sub_code"><h3>Pick subject to predict.</h3></label>
                    <select id = "sub_code" name ="sub_code" required>
                        <option value="blank"></option>
                        <option value="9231"><p>9231-further math</p></option>
                        <option  value="9709"><p>9709-mathematics</p></option>
                        <option value="9700"><p>9700-biology</p></option>
                        <option value="9701"><p>9701-chemistry</p></option>
                        <option value="9702"><p>9702-physics</p></option>
                        <option value="9699"><p>9699-sociology</p></option>
                        <option value="9708"><p>9708-economics</p></option>
                        <option value="9609"><p>9609-business</p></option>
                        <option value="9626"><p>9626-IT</p></option>
                    </select><br/><br/>
                    <label for = "component"><h3>What are the components you took?</h3></label>
                    <input id = "component" name="components"placeholder= "e.g. 12, 22, 32 "pattern="\d+(, \d+)*" title="Number, comma, space, number e.g. 12, 22, 32"  required/><br/><br/>
                    <label for = "score"><h3>What score do you predict for yourself (with weighting applied)?</h3></label>
                    <input id ="score" name="total_score" placeholder ="e.g. 198"type="number" required/>
                    <button type ="submit">Submit</button>
                </form>
            </div>
        </div>
    </body>
</html>
