<!DOCTYPE html>
<html>
    <head>
        <title>Prediction.</title>
    </head>
    <body>
        <div id = "info_collection">
            <form>
                <label for = "edu_level"><h3>Pick your education level.</h3></label><br>
                <select id="edu_level">
                    <option name="blank"></option>
                    <option name="education-AS"><p>AS Level</p></option>
                    <option  name="education-A2"><p> Level</p></option>
                </select><br><br>
                <label for = "sub_code"><h3>Pick subject to predict.</h3></label><br>
                <select id = "sub_code">
                    <option name="blank"></option>
                    <option  name="math_code"><p>9709-mathematics</p></option>
                    <option name="bio_code"><p>9700-biology</p></option>
                    <option name="chem_code"><p>9701-chemistry</p></option>
                    <option name="phy_code"><p>9702-physics</p></option>
                </select><br><br>
                <label for = "component"><h3>What are the components you took?</h3></label><br>
                <input id = "component" type ="text" name="components"><br><br>
                <label for = "score"><h3>What score do you predict for yourself (with weighting applied)</h3></label><br>
                <input id ="score" name="total_score">
            </form>

        </div>
    </body>
</html>
